name: Speakeasy Regenerate

# Regenerates the provider when Renovate bumps speakeasyVersion in
# .speakeasy/workflow.yaml and pushes the result to the Renovate branch.
on:
  push:
    branches:
      - 'renovate/speakeasy-update-*'
    paths:
      - .speakeasy/workflow.yaml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # ratchet:actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      # Any recent CLI works: it downloads the version pinned in workflow.yaml.
      - name: Install Speakeasy CLI
        run: curl -fsSL https://go.speakeasy.com/cli-install.sh | sh

      - name: Regenerate provider
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: speakeasy run --skip-versioning --skip-upload-spec

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so verify here.
      - name: Build
        run: go build ./...

      - name: Commit and push changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate provider with updated Speakeasy"
            git push
          else
            echo "No changes after regeneration"
          fi
