    AwsBatchForgeReadModel:
      type: object
      required:
        - minCpus
        - maxCpus
        - gpuEnabled
        - ebsAutoScale
        - instanceTypes
        - imageId
        - vpcId
        - subnets
        - securityGroups
        - fsxMount
        - fsxName
        - fsxSize
        - disposeOnDeletion
        - ec2KeyPair
        - allowBuckets
        - ebsBlockSize
        - fusionEnabled
        - bidPercentage
        - efsCreate
        - efsId
        - efsMount
        - dragenEnabled
        - dragenAmiId
        - ebsBootSize
        - ecsConfig
        - fargateHeadEnabled
        - arm64Enabled
        - dragenInstanceType
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AwsForgeType'
          description: Provisioning model of the instances. `EC2` deploys uninterruptible on-demand EC2 instances. `SPOT` deploys interruptible Spot instances (lower cost).
        minCpus:
          type: integer
          format: int32
          nullable: true
          description: Minimum CPUs provisioned in the compute environment.
        maxCpus:
          type: integer
          format: int32
          nullable: true
          description: Maximum CPUs provisioned in the compute environment.
        gpuEnabled:
          type: boolean
          nullable: true
          description: If `true`, enables GPU instances.
        ebsAutoScale:
          type: boolean
          nullable: true
          description: If `true`, provisions an EBS auto-expandable disk in the compute environment. Not compatible with Fusion file system.
        instanceTypes:
          type: array
          items:
            type: string
          nullable: true
          description: Array of allowed EC2 instance types.
        allocStrategy:
          allOf:
            - $ref: '#/components/schemas/AwsForgeAllocStrategy'
          description: |-
            Determines how AWS Batch selects EC2 instances to carry out job executions. Accepts `BEST_FIT`,
            `BEST_FIT_PROGRESSIVE`, `SPOT_CAPACITY_OPTIMIZED`, or `SPOT_PRICE_CAPACITY_OPTIMIZED`. Default:
            `BEST_FIT_PROGRESSIVE` for on-demand instances and `SPOT_PRICE_CAPACITY_OPTIMIZED` for Spot instances.
        imageId:
          type: string
          nullable: true
          description: |-
            Custom AMI ID to use for launching EC2 instances. Must be an AWS Linux-2 ECS-optimized image that meets the
            compute resource's AMI specification. If omitted, the latest approved version of the Amazon ECS-optimized AMI for
            compute resources is used.
        vpcId:
          type: string
          nullable: true
          description: VPC ID for networking.
        subnets:
          type: array
          items:
            type: string
          nullable: true
          description: Array of VPC subnets to isolate EC2 resources from each other, or the internet.
        securityGroups:
          type: array
          items:
            type: string
          nullable: true
          description: Array of security group IDs to define a set of firewall rules that control EC2 compute node traffic.
        fsxMount:
          type: string
          nullable: true
          description: FSx for Lustre mount point.
        fsxName:
          type: string
          nullable: true
          description: FSx for Lustre file system name.
        fsxSize:
          type: integer
          format: int32
          nullable: true
          description: FSx for Lustre file system size in GB.
        disposeOnDeletion:
          type: boolean
          nullable: true
          description: If `true`, deletes the AWS resources when the compute environment is deleted.
        ec2KeyPair:
          type: string
          nullable: true
          description: EC2 key pair for SSH access.
        allowBuckets:
          type: array
          items:
            type: string
          nullable: true
          description: Array of additional S3 buckets accessible to the compute environment.
        ebsBlockSize:
          type: integer
          format: int32
          nullable: true
          description: EBS volume size in GB.
        fusionEnabled:
          type: boolean
          nullable: true
          description: If `true`, enables Fusion file system (v1).
        bidPercentage:
          type: integer
          format: int32
          nullable: true
          description: |-
            Maximum allowed price of a Spot instance, as a percentage of the on-demand price for that instance type. Spot
            instances will not be launched until the current spot price is below the specified cost percentage. Default:
            `100%`.
        efsCreate:
          type: boolean
          nullable: true
          description: If `true`, creates a new EFS file system.
        efsId:
          type: string
          nullable: true
          description: Existing EFS file system ID.
        efsMount:
          type: string
          nullable: true
          description: EFS file system mount point in containers.
        dragenEnabled:
          type: boolean
          nullable: true
          description: If `true`, enables [DRAGEN](https://docs.seqera.io/platform-cloud/supported_software/dragen/overview) support.
        dragenAmiId:
          type: string
          nullable: true
          description: AMI ID for [DRAGEN](https://docs.seqera.io/platform-cloud/supported_software/dragen/overview) instances.
        ebsBootSize:
          type: integer
          format: int32
          nullable: true
          description: Boot disk size for instances, in GB.
        ecsConfig:
          type: string
          nullable: true
          description: |-
            Custom configuration for the ECS agent parameters used by AWS Batch. Appended to the `/etc/ecs/ecs.config` file
            in each cluster node. Altering this file may result in a malfunctioning Batch Forge compute environment. See
            [ECS agent configuration](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-agent-config.html).
        fargateHeadEnabled:
          type: boolean
          nullable: true
          description: |-
            If `true`, runs the Nextflow head job on Fargate container service. Requires Fusion file system and Spot instance
            provisioning model. Fargate is not compatible with EFS and FSx file systems.
        arm64Enabled:
          type: boolean
          nullable: true
          description: If `true`, enables ARM64 (Graviton) instances. Requires Fargate, Wave containers, and Fusion file system.
        dragenInstanceType:
          type: string
          nullable: true
          description: Instance type for DRAGEN workflows.
      description: |-
        Batch Forge configuration for AWS Batch compute environments. Batch Forge automatically creates the AWS Batch
        compute environment and job queue resources required by the compute environment.
