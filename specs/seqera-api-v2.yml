openapi: 3.0.0
info:
  title: Seqera Platform API
  version: 2.0.0-rc-2
  description: Seqera Platform API v2.
tags:
  - name: ServiceInfo
  - name: Credentials
  - name: Compute environments
  - name: Pipeline Secrets
    description: Pipeline secrets in a user or workspace context
paths:
  /v2/service-info:
    get:
      operationId: InfoV2
      summary: Get service info
      description: |-
        Returns version and build metadata for the API.

        **Required permission:** _none (public)_
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInfoResponse'
      tags:
        - ServiceInfo
      security:
        - {}
      x-badges:
        - label: experimental
          color: orange
  /v2/workspaces/{workspaceId}/compute-envs:
    get:
      operationId: listComputeEnvs
      summary: List compute environments
      description: |-
        Lists the compute environments of the workspace.

        **Required permission:** `compute_environment:read`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: pageToken
          in: query
          required: false
          description: |-
            Continuation token taken from the `nextPageToken` of a prior response. Omit it to retrieve the first page. A
            malformed token is rejected.
          schema:
            type: string
          explode: false
        - name: pageSize
          in: query
          required: false
          description: 'Maximum number of compute environments to return. Must be between 1 and 100. Default: `50`.'
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
        - name: filter
          in: query
          required: false
          description: |-
            Filter expression narrowing the page to the compute environments it matches.

            The filterable fields are the following:

            - `status`: its values are the ones of the `status` field, such as `AVAILABLE` or `INVALID`. It supports:
              - equality: `status == "AVAILABLE"`
              - membership: `status in ["AVAILABLE", "DISABLED"]`
              - disjunctions of them: `status == "AVAILABLE" || status == "DISABLED"`

            Malformed expressions are rejected.
          schema:
            type: string
          explode: false
        - name: include
          in: query
          required: false
          description: |-
            Additional fields to include in each compute environment, as a comma-separated list. Accepts `resourceLabels`
            or `resources`. Fields not included are `null`; unknown fields are rejected.
          schema:
            type: array
            items:
              type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeEnvsPage'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
    post:
      operationId: createComputeEnv
      summary: Create compute environment
      description: |-
        Creates a new compute environment in the workspace.

        The cloud resources of a compute environment whose configuration requests them (such as AWS Batch Forge) are
        provisioned asynchronously, while its status is `CREATING`.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: validateOnly
          in: query
          required: false
          description: |-
            Validates the request without creating anything. When `true`, the server runs the same
            validation it would for a real request and reports what the result would be, but persists
            nothing and triggers no side effects, so the fields the server populates on creation may be missing.
            Validation failures surface as they would otherwise.
            Not to be confused with the `/validate` operation, which re-runs the pre-flight checks of an existing
            compute environment.
            Defaults to `false`.
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeEnvReadModel'
        '400':
          description: |-
            The request is malformed or invalid. When some of the selected instance types fail the capability requirements
            of the compute environment, the problem document lists each of them, so they can be dealt with in one go.
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorDetailWithRejectedInstanceTypes'
                  - $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorDetailWithRejectedInstanceTypes'
                  - $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Another compute environment in the workspace already goes by that name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeEnvWriteModel'
  /v2/workspaces/{workspaceId}/compute-envs/{computeEnvId}:
    get:
      operationId: getComputeEnv
      summary: Get compute environment
      description: |-
        Retrieves detailed information for the compute environment.

        **Required permission:** `compute_environment:read`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
        - name: include
          in: query
          required: false
          description: |-
            Additional fields to include in the compute environment, as a comma-separated list. Accepts `resourceLabels`
            or `resources`. Fields not included are `null`; unknown fields are rejected.
          schema:
            type: array
            items:
              type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeEnvReadModel'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
    patch:
      operationId: updateComputeEnv
      summary: Update compute environment
      description: |-
        Updates the compute environment with the provided values. Only the fields named by `updateMask`, or supplied in
        the request body when it is omitted, are modified.

        Replacing the credentials probes the platform with the new ones, and makes the compute environment `AVAILABLE`.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
        - name: updateMask
          in: query
          required: false
          description: |-
            Names of the fields to write, as a comma-separated list. When given, exactly those fields are written. When
            omitted, the mask is inferred from the request body, where a field carrying a value joins it and one carried as
            `null` or omitted stays out.
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: validateOnly
          in: query
          required: false
          description: |-
            Validates the request without updating anything. When `true`, the server runs the same
            validation it would for a real request and reports what the result would be, but persists
            nothing and triggers no side effects. Validation failures surface as they would otherwise.
            Not to be confused with the `/validate` operation, which re-runs the pre-flight checks of an existing
            compute environment.
            Defaults to `false`.
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputeEnvReadModel'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Another compute environment in the workspace already goes by that name.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeEnvPatchModel'
    delete:
      operationId: deleteComputeEnv
      summary: Delete compute environment
      description: |-
        Deletes the compute environment, along with the cloud resources provisioned for it, which are disposed of
        asynchronously while its status is `DELETING`. A compute environment with active jobs, that is, active workflow
        runs or Studios, cannot be deleted.

        Append `?force=true` to bypass the active-job checks and the cleanup of the cloud resources. Force deletion is
        only allowed for environments in `ERRORED`, `INVALID`, or `DELETING` status.

        **Required permission:** `compute_environment:delete`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: |-
            If `true`, force-deletes a stuck compute environment, bypassing the active-job checks (that is, active workflow
            runs or Studios) and the cleanup of its cloud resources, which are left for the caller. Only valid for
            environments in `ERRORED`, `INVALID`, or `DELETING` status. Default: `false`.
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: |-
            The compute environment cannot be deleted in its current status: it is still being created or already being
            deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
  /v2/workspaces/{workspaceId}/compute-envs/{computeEnvId}/disable:
    post:
      operationId: disableComputeEnv
      summary: Disable compute environment
      description: |-
        Disables the compute environment until it is enabled again.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
  /v2/workspaces/{workspaceId}/compute-envs/{computeEnvId}/enable:
    post:
      operationId: enableComputeEnv
      summary: Enable compute environment
      description: |-
        Enables the compute environment, so it can be used again.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
  /v2/workspaces/{workspaceId}/compute-envs/{computeEnvId}/set-primary:
    post:
      operationId: setPrimaryComputeEnv
      summary: Set primary compute environment
      description: |-
        Makes the compute environment the primary one of the workspace.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
  /v2/workspaces/{workspaceId}/compute-envs/{computeEnvId}/validate:
    post:
      operationId: validateComputeEnv
      summary: Validate compute environment
      description: |-
        Re-runs the pre-flight checks for the compute environment, including credential validation and work directory
        accessibility. Persists the outcome to the compute environment and its credentials. Use to recover an `INVALID`
        compute environment after the underlying problem has been fixed. Only compute environments in `AVAILABLE` or
        `INVALID` status can be validated.

        **Required permission:** `compute_environment:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: computeEnvId
          in: path
          required: true
          description: Compute environment identifier.
          schema:
            type: string
        - name: force
          in: query
          required: false
          description: |-
            If `true`, skips the credential and work directory checks and forces the compute environment to `AVAILABLE`.
            Only valid for an `INVALID` compute environment whose credentials are `AVAILABLE`. Default: `false`.
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateComputeEnvResponse'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '405':
          description: Validation is not available, since the pre-flight checks are disabled in this installation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: |-
            The checks were forced, but the compute environment is not `INVALID` or its credentials are not `AVAILABLE`, so its
            status cannot be forced to `AVAILABLE`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Compute environments
  /v2/workspaces/{workspaceId}/credentials:
    get:
      operationId: listCredentials
      summary: List credentials
      description: |-
        Lists the credentials of the workspace, ordered by creation date, newest first.

        **Required permission:** `credentials:read`
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: pageToken
          in: query
          required: false
          description: |-
            Continuation token taken from the `nextPageToken` of a prior response. Omit it to retrieve
            the first page. A malformed token is rejected.
          schema:
            type: string
          explode: false
        - name: pageSize
          in: query
          required: false
          description: Maximum number of credentials to return in the page. Out-of-range values are rejected.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
          explode: false
        - name: filter
          in: query
          required: false
          description: |-
            Filter expression narrowing the page to the credentials it matches.

            The filterable fields are the following:

            - `keys.provider`: its values are the ones
            the `keys` variants are discriminated by, such as `AWS`, `AZURE_CLOUD`, or `S3`. It supports
            equality, membership, and disjunctions of them: `keys.provider == "AWS"`,
            `keys.provider in ["AWS", "S3"]`, `keys.provider == "AWS" || keys.provider == "S3"`.

            Malformed expressions are rejected.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsPage'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Credentials
    post:
      operationId: createCredentials
      summary: Create credentials
      description: |-
        Creates credentials in the workspace.

        **Required permission:** `credentials:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: validateOnly
          in: query
          required: false
          description: |-
            Validates the request without creating anything. When `true`, the server runs the same
            validation it would for a real request and reports what the result would be, but persists
            nothing and triggers no side effects, so the fields the server populates on creation may be missing.
            Validation failures surface as they would otherwise.
            Not to be confused with the `/validate` operation, which checks the credentials against their
            provider.
            Defaults to `false`.
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsReadModel'
        '400':
          description: Malformed or invalid request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: Missing or invalid authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: |-
            Another set of credentials in the workspace already goes by that name, or, for SCM credentials,
            already carries that `baseUrl`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsWriteModel'
  /v2/workspaces/{workspaceId}/credentials/{credentialsId}:
    get:
      operationId: getCredentials
      summary: Get credentials
      description: |-
        Retrieves the credentials.

        **Required permission:** `credentials:read`
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: credentialsId
          in: path
          required: true
          schema:
            type: string
      responses:
