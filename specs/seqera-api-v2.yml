              schema:
                $ref: '#/components/schemas/ErrorDetail'
      tags:
        - Credentials
    patch:
      operationId: updateCredentials
      summary: Update credentials
      description: |-
        Updates the credentials.

        **Required permission:** `credentials:write`
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
        - name: credentialsId
          in: path
          required: true
          schema:
            type: string
        - name: updateMask
          in: query
          required: false
          description: |-
            Names of the fields to write, as a comma-separated list. When given, exactly those fields are
            written. When omitted, the mask is inferred from the request body, where a field carrying a value joins it and
            one carried as `null` or omitted stays out.
          schema:
            type: array
            items:
              type: string
          explode: false
        - name: validateOnly
          in: query
          required: false
          description: |-
            Validates the request without updating anything. When `true`, the server runs the same
            validation it would for a real request and reports what the result would be, but persists
            nothing and triggers no side effects. Validation failures surface as they would otherwise.
            Not to be confused with the `/validate` operation, which checks the credentials against their
            provider.
            Defaults to `false`.
          schema:
            type: boolean
            default: false
          explode: false
