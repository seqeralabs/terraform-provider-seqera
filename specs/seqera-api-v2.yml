    NotFoundResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/ErrorDetail'
      description: The requested resource does not exist.
    PipelineSecretPage:
      type: object
      required:
        - items
        - nextPageToken
        - totalSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PipelineSecretReadModel'
          description: The items in this page.
        nextPageToken:
          type: string
          nullable: true
          description: |-
            Continuation token to pass as `pageToken` to retrieve the next page. `null` on the last page,
            which is how the end of the collection is signalled.
        totalSize:
          type: integer
          format: int64
          description: Total number of items matching the request, across every page.
      description: One page of pipeline secrets.
    PipelineSecretPatchModel:
      type: object
      required:
        - value
      properties:
        value:
          type: string
          description: |-
            Updated secret value, stored securely for future pipeline launches. Required, since it is the only
            field a patch can write and a secret cannot be left without a value; the maximum length is set per
            installation (8192 characters by default), and a longer value is rejected with `400`.
      description: The subset of a pipeline secret that can be changed after creation.
    PipelineSecretReadModel:
      type: object
      required:
        - id
        - name
        - lastUsedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          nullable: true
          description: Secret identifier.
        name:
          type: string
          description: Unique name for the secret, as referenced from a pipeline.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the secret was last used by a pipeline run.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the secret record was created.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the secret record was last updated.
      description: A secret made available to pipelines.
    PipelineSecretWriteModel:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          pattern: ^[a-zA-Z_](?:[0-9A-Za-z]+(?:_[0-9A-Za-z]+){0,24}|[0-9A-Za-z]+(?:_[0-9A-Za-z]+){0,23}_|_[0-9A-Za-z]+(?:_[0-9A-Za-z]+){0,23}_?|_)$
          description: |-
            Name for the secret, unique within the workspace it belongs to. Nextflow resolves the secret by
            this name.
        value:
          type: string
          description: |-
            Secret value, stored securely for use in pipeline launches. The maximum length is set per
            installation (8192 characters by default); a longer value is rejected with `400`.
      description: The pipeline secret as it is created.
    PodCleanupPolicy:
      type: string
      enum:
        - ON_SUCCESS
        - ALWAYS
        - NEVER
      description: Pod cleanup policy after job completion. One of `ON_SUCCESS`, `ALWAYS`, or `NEVER`.
    RejectedInstanceType:
      type: object
      required:
        - instanceType
        - failedRequirements
      properties:
        instanceType:
          type: string
          description: Instance type identifier, such as `t3.nano`.
        failedRequirements:
          type: array
          items:
            $ref: '#/components/schemas/InstanceTypeRequirement'
          description: Required capabilities the instance type lacks.
      description: An instance type rejected for lacking some of the required capabilities.
    S3KeysReadModel:
      type: object
      required:
        - accessKey
        - pathStyleAccessEnabled
      properties:
        accessKey:
          type: string
          nullable: true
          description: Access key ID.
        pathStyleAccessEnabled:
          type: boolean
          nullable: true
          description: Whether path-style bucket addressing is used.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysReadModelBase'
      description: S3-compatible keys.
      title: 'provider: S3'
    S3KeysWriteModel:
