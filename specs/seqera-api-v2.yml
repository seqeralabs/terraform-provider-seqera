    GoogleCloudConfigReadModel:
      type: object
      required:
        - workDir
        - region
        - preRunScript
        - postRunScript
        - nextflowConfig
        - waveEnabled
        - fusion2Enabled
        - overrideNextflowFusionVersion
        - fusionVersion
        - schedEnabled
        - projectId
        - network
        - subnetworks
        - networkTags
        - usePrivateAddress
        - instanceType
        - imageId
        - arm64Enabled
        - gpuEnabled
        - bootDiskSizeGb
        - zone
        - serviceAccountEmail
      properties:
        workDir:
          type: string
          description: |-
            Work directory path for storing intermediate workflow files. A `gs://` bucket the credentials can access, without
            a trailing slash.
        region:
          type: string
          description: Google Cloud region (e.g., `us-central1`).
        preRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes in the nf-launch script prior to invoking Nextflow processes. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        postRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes after all Nextflow processes have completed. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        nextflowConfig:
          type: string
          nullable: true
          description: Additional Nextflow configuration to apply. See [Nextflow config file](https://docs.seqera.io/platform-cloud/launch/advanced#nextflow-config-file).
        waveEnabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Wave containers](https://docs.seqera.io/wave). Default: `false`.'
        fusion2Enabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Fusion file system](https://docs.seqera.io/fusion). Requires Wave containers. Default: `false`.'
        overrideNextflowFusionVersion:
          type: boolean
          nullable: true
          description: |-
            If `true`, launches override the Fusion version provided by the Nextflow launcher container. Applies only when
            Wave containers and Fusion file system are enabled.
        fusionVersion:
          type: string
          nullable: true
          description: |-
            Fusion version used when `overrideNextflowFusionVersion` is `true`. Must be listed by the system catalog and be
            compatible with the deployed services. If `null`, the catalog default is used.
        schedEnabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables Seqera Scheduler (Intelligent Compute) execution for this compute environment. Default: `false`.'
        projectId:
          type: string
          nullable: true
          description: Google Cloud project ID.
        network:
          type: string
          nullable: true
          description: |-
            VPC network for compute instances, as a short name or fully qualified path. If empty, the project `default`
            network is used. Required when `usePrivateAddress` is `true`.
        subnetworks:
          type: array
          items:
            type: string
          nullable: true
          description: |-
            Array of subnetworks for compute instances, as short names in the compute environment region or fully qualified
            paths. Without Seqera Scheduler, only the first subnetwork is used. With Seqera Scheduler (Intelligent Compute),
            any of the subnetworks can be used.
        networkTags:
          type: array
          items:
            type: string
          nullable: true
          description: Array of network tags applied to compute instances, used as targets for VPC firewall rules.
        usePrivateAddress:
          type: boolean
          nullable: true
          description: |-
            If `true`, instances are launched without an external IP address. Requires `network` to be set, and Cloud NAT and
            Private Google Access to be enabled on the subnetwork.
        instanceType:
          type: string
          nullable: true
          description: Machine type (e.g., `n1-standard-1`). If omitted, a default instance type is used.
        imageId:
          type: string
          nullable: true
          description: |-
            ID of the image defining the operating system and pre-installed software for the VM.
            [Ubuntu LTS](https://cloud.google.com/compute/docs/images/os-details#ubuntu_lts) Google public images are
            supported. For GPU-enabled instances, a
            [Deep Learning VM](https://cloud.google.com/deep-learning-vm/docs/images#base_versions) base image with CUDA
            pre-installed is automatically selected.
        arm64Enabled:
          type: boolean
          nullable: true
          description: If `true`, enables ARM64 instances.
        gpuEnabled:
          type: boolean
          nullable: true
          description: If `true`, enables GPU instances.
        bootDiskSizeGb:
          type: integer
          format: int32
          nullable: true
          description: Size of the boot disk for the Compute Engine instance, in GB. `pd-standard` is used. If omitted, a default 50 GB volume is used.
        zone:
          type: string
          nullable: true
          description: Google Cloud zone within the region (e.g., `us-central1-a`). Set by the server from the resources it provisions.
        serviceAccountEmail:
          type: string
          nullable: true
          description: Service account email for IAM access to instances. Set by the server from the resources it provisions.
        schedConfig:
          allOf:
            - $ref: '#/components/schemas/SchedConfigReadModel'
          description: Scheduler-specific settings for Seqera Scheduler (Intelligent Compute) execution.
      allOf:
        - $ref: '#/components/schemas/ComputeEnvConfigReadModelBase'
      description: Google Cloud compute environment configuration.
      title: 'platform: GOOGLE_CLOUD'
