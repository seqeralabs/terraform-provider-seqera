          GOOGLE_CLOUD: '#/components/schemas/GoogleCloudConfigWriteModel'
          GOOGLE_LIFE_SCIENCES: '#/components/schemas/GoogleLifeSciencesConfigWriteModel'
          AZURE_BATCH: '#/components/schemas/AzureBatchConfigWriteModel'
          AZURE_CLOUD: '#/components/schemas/AzureCloudConfigWriteModel'
          K8S: '#/components/schemas/K8sConfigWriteModel'
          EKS: '#/components/schemas/EksConfigWriteModel'
          GKE: '#/components/schemas/GkeConfigWriteModel'
          UGE: '#/components/schemas/UgeConfigWriteModel'
          SLURM: '#/components/schemas/SlurmConfigWriteModel'
          LSF: '#/components/schemas/LsfConfigWriteModel'
          ALTAIR_PBS: '#/components/schemas/AltairPbsConfigWriteModel'
          MOAB: '#/components/schemas/MoabConfigWriteModel'
          LOCAL: '#/components/schemas/LocalConfigWriteModel'
      description: Platform-specific compute environment configuration. The `platform` discriminator selects the configuration variant.
    ComputeEnvConfigWriteModelBase:
      type: object
      required:
        - platform
      properties:
        platform:
          type: string
          description: |-
            Compute platform provider, which selects the configuration variant. One of `AWS_BATCH`, `AWS_CLOUD`,
            `SEQERA_COMPUTE`, `GOOGLE_BATCH`, `GOOGLE_CLOUD`, `GOOGLE_LIFE_SCIENCES`, `AZURE_BATCH`, `AZURE_CLOUD`, `K8S`,
            `EKS`, `GKE`, `UGE`, `SLURM`, `LSF`, `ALTAIR_PBS`, `MOAB`, or `LOCAL`.
        environment:
          type: array
          items:
            $ref: '#/components/schemas/ComputeEnvVariableWriteModel'
          nullable: true
          description: Array of environment variables for the compute environment, applied to the Nextflow head job, the compute jobs, or both. Can be `null`.
      description: Fields shared by every configuration variant.
    ComputeEnvPatchModel:
      type: object
      properties:
        name:
          type: string
          nullable: true
          minLength: 2
          maxLength: 99
          pattern: ^[a-zA-Z\d](?:[a-zA-Z\d]|[-_](?=[a-zA-Z\d])){1,98}$
          description: |-
            Unique name for the compute environment in the workspace. Must consist of 2-99 alphanumeric, dash, or underscore
            characters, starting with an alphanumeric character, where every dash or underscore is followed by an
            alphanumeric character. Cannot be cleared.
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: 'Description of the compute environment. Maximum length: 2000 characters. Can be `null`.'
        credentialsId:
          type: string
          allOf:
            - $ref: '#/components/schemas/CredentialsIdentifier'
          nullable: true
          description: |-
            Credentials identifier of the credentials of the workspace to authenticate with, replacing the current ones.
            Accepted only once the current credentials have been deleted, and never for a compute environment that
            authenticates with a managed identity. Cannot be cleared.
        fusionMetricsCollectionEnabled:
          type: boolean
          nullable: true
          description: |-
            If `true`, Platform collects the Fusion metrics files of this compute environment when jobs complete. Can be
            enabled only when the Fusion file system is enabled. Cannot be cleared.
        config:
          $ref: '#/components/schemas/ComputeEnvConfigPatchModel'
      description: |-
        The subset of a compute environment that can be changed after creation. The platform and the rest of its
        configuration are fixed at creation, so they are absent here.
    ComputeEnvReadModel:
      type: object
      required:
        - id
        - name
        - description
        - message
        - primary
        - credentialsId
        - managedIdentityId
        - fusionMetricsCollectionEnabled
        - resourceLabels
        - lastUsedAt
        - createdAt
        - updatedAt
        - config
      properties:
        id:
          type: string
          nullable: true
          description: Compute environment identifier. Can be `null` when the request was only validated.
        name:
          type: string
          description: |-
            Unique name for the compute environment in the workspace. Must consist of 2-99 alphanumeric, dash, or underscore
            characters, starting with an alphanumeric character, where every dash or underscore is followed by an
            alphanumeric character.
        description:
          type: string
          nullable: true
          description: Description of the compute environment. Can be `null`.
        status:
          allOf:
            - $ref: '#/components/schemas/ComputeEnvStatus'
          description: Current status of the compute environment. Can be `null` when the request was only validated.
        message:
          type: string
          nullable: true
          description: |-
            Optional status or error message associated with the compute environment, such as the reason it is `ERRORED` or
            `INVALID`. Can be `null`.
        primary:
          type: boolean
          description: If `true`, this compute environment is the primary compute environment of the workspace, the one launches default to.
        credentialsId:
          type: string
          nullable: true
          description: |-
            Credentials identifier of the credentials the compute environment authenticates with. Can be `null` if the
            compute environment authenticates with a managed identity.
        managedIdentityId:
          type: string
          nullable: true
          description: |-
            Managed identity identifier associated with the compute environment. Can be `null` if the compute environment
            authenticates with credentials.
        fusionMetricsCollectionEnabled:
          type: boolean
          nullable: true
          description: |-
            If `true`, Platform collects the Fusion metrics files at job completion for workflows run on this compute
            environment. Can be `null`.
        resourceLabels:
          type: array
          items:
            $ref: '#/components/schemas/ComputeEnvResourceLabelReadModel'
          nullable: true
          description: Array of resource labels assigned to the compute environment. Can be `null` unless `include` names `resourceLabels`.
        resources:
          allOf:
            - $ref: '#/components/schemas/ComputeEnvResourcesReadModel'
          description: Estimated compute resources available to the compute environment. Can be `null` unless `include` names `resources`.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the compute environment was last used to launch a workflow. Can be `null`.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the compute environment record was created. Can be `null` when the request was only validated.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the compute environment record was last updated. Can be `null` when the request was only validated.
        config:
          $ref: '#/components/schemas/ComputeEnvConfigReadModel'
      description: Compute environment details, including platform configuration, status, and associated credentials.
    ComputeEnvResourceLabelReadModel:
      type: object
      required:
        - id
        - name
        - value
      properties:
        id:
          type: string
          description: Label identifier.
        name:
          type: string
          description: Label name.
        value:
          type: string
          nullable: true
          description: Label value. Can be `null`.
      description: Resource label assigned to a compute environment, propagated to its cloud resources as a tag.
    ComputeEnvResourcesReadModel:
      type: object
      required:
        - cpus
        - memory
        - gpus
        - gpuEnabled
        - diskSize
        - estimatedPrice
        - instanceType
      properties:
        cpus:
          type: integer
          format: int32
          nullable: true
          description: Number of CPUs available to the compute environment. Can be `null` if the information is not available.
        memory:
          type: integer
          format: int32
          nullable: true
          description: Amount of memory available to the compute environment in GB. Can be `null` if the information is not available.
        gpus:
          type: integer
          format: int32
          nullable: true
          description: Number of GPUs available to the compute environment. Can be `null` if the information is not available.
        gpuEnabled:
          type: boolean
          nullable: true
          description: |-
            If `true`, the compute environment provisions GPU-enabled instances. Used by platforms that record only a GPU
            on/off setting, where the GPU count is unknown. Can be `null` if the information is not available.
        diskSize:
          type: integer
          format: int32
          nullable: true
          description: Disk size available to the compute environment in GB. Can be `null` if the information is not available.
        estimatedPrice:
          type: number
          format: float
          nullable: true
          description: Estimated hourly price for the compute environment. Can be `null` if the information is not available.
        instanceType:
          type: string
          nullable: true
          description: Cloud instance type selected for the compute environment. Can be `null` if the information is not available.
      description: Estimated resources available to a compute environment, as far as they can be told from its configuration.
    ComputeEnvStatus:
      type: string
      enum:
        - CREATING
        - AVAILABLE
        - DISABLED
        - DELETING
        - ERRORED
        - INVALID
      description: Compute environment status. One of `CREATING`, `AVAILABLE`, `DISABLED`, `DELETING`, `ERRORED`, or `INVALID`.
    ComputeEnvVariableReadModel:
      type: object
      required:
        - name
        - value
        - head
        - compute
      properties:
        name:
          type: string
          nullable: true
          description: Environment variable name.
        value:
          type: string
          nullable: true
          description: Environment variable value.
        head:
          type: boolean
          nullable: true
          description: If `true`, the variable is applied to the Nextflow head job.
        compute:
          type: boolean
          nullable: true
          description: If `true`, the variable is applied to the Nextflow compute jobs. At least one of `head` and `compute` must be `true`.
      description: Environment variable applied to the Nextflow head job, the compute jobs, or both.
    ComputeEnvVariableWriteModel:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Environment variable name.
        value:
          type: string
          nullable: true
          description: Environment variable value.
        head:
          type: boolean
          nullable: true
          description: If `true`, the variable is applied to the Nextflow head job.
        compute:
          type: boolean
          nullable: true
          description: If `true`, the variable is applied to the Nextflow compute jobs. At least one of `head` and `compute` must be `true`.
      description: Environment variable applied to the Nextflow head job, the compute jobs, or both.
    ComputeEnvWriteModel:
      type: object
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 99
          pattern: ^[a-zA-Z\d](?:[a-zA-Z\d]|[-_](?=[a-zA-Z\d])){1,98}$
          description: |-
            Unique name for the compute environment in the workspace. Must consist of 2-99 alphanumeric, dash, or underscore
            characters, starting with an alphanumeric character, where every dash or underscore is followed by an
            alphanumeric character.
        description:
          type: string
          nullable: true
          maxLength: 2000
          description: 'Description of the compute environment. Maximum length: 2000 characters. Can be `null`.'
        credentialsId:
          type: string
          allOf:
            - $ref: '#/components/schemas/CredentialsIdentifier'
          nullable: true
          description: |-
            Credentials identifier for compute environment authentication. Requires existing cloud provider or HPC
            credentials of the workspace. Not used by Seqera Compute, which authenticates with the Seqera Compute
            credentials of the workspace. Can be `null`.
        managedIdentityId:
          type: string
          nullable: true
          description: |-
            Managed identity identifier for compute environment authentication, instead of credentials. Requires an existing
            managed identity of the organization. Can be `null`.
        resourceLabelIds:
          type: array
          items:
            type: string
          nullable: true
          description: |-
            Array of identifiers of the resource labels of the workspace to assign to the compute environment, with distinct
            names. Can be `null`.
        fusionMetricsCollectionEnabled:
          type: boolean
          nullable: true
          description: |-
            If `true`, Platform collects the Fusion metrics files of this compute environment when jobs complete. Can be
            enabled only when the Fusion file system is enabled, and defaults to whether it is. Does not change the Nextflow
            configuration or stop Fusion from generating metrics.
        config:
          $ref: '#/components/schemas/ComputeEnvConfigWriteModel'
      description: Compute environment to create, including its platform configuration and associated credentials.
    ComputeEnvsPage:
      type: object
      required:
        - items
        - nextPageToken
        - totalSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComputeEnvReadModel'
          description: The items in this page.
        nextPageToken:
          type: string
          nullable: true
          description: |-
            Continuation token to pass as `pageToken` to retrieve the next page. `null` on the last page,
            which is how the end of the collection is signalled.
        totalSize:
          type: integer
          format: int64
          description: Total number of items matching the request, across every page.
      description: One page of compute environments.
    ConflictingResource:
      type: object
      required:
        - type
        - id
        - name
        - url
      properties:
        type:
          type: string
          description: Kind of resource
        id:
          type: string
          description: Identifier of the resource.
        name:
          type: string
          description: Name of the resource.
        url:
          type: string
          description: Address at which the resource can be inspected.
      description: A resource standing in the way of the request, which has to be dealt with before it can succeed.
    ContainerRegistryKeysReadModel:
      type: object
      required:
        - userName
        - registry
      properties:
        userName:
          type: string
          nullable: true
          description: Registry username.
        registry:
          type: string
          nullable: true
          description: |-
            Container registry server URL, for example `docker.io`, `quay.io`, or a custom registry
            domain. Defaults to `docker.io`.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysReadModelBase'
      description: |-
        Container registry credentials for authenticating with container registries including AWS ECR,
        Docker Hub, and Google Artifact Registry.
      title: 'provider: CONTAINER_REGISTRY'
    ContainerRegistryKeysWriteModel:
      type: object
      required:
        - userName
        - password
      properties:
        userName:
          type: string
          minLength: 1
          description: Registry username.
        password:
          type: string
          minLength: 1
          description: Registry password or access token.
        registry:
          type: string
          nullable: true
          description: |-
            Container registry server URL, for example `docker.io`, `quay.io`, or a custom registry
            domain. Defaults to `docker.io`.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysWriteModelBase'
      description: |-
        Container registry credentials for authenticating with container registries including AWS ECR,
        Docker Hub, and Google Artifact Registry.
      title: 'provider: CONTAINER_REGISTRY'
    CredentialStatus:
      type: string
      enum:
        - AVAILABLE
        - INVALID
      description: Validation health of a credential.
    CredentialsIdentifier:
      type: string
      pattern: ^[0-9A-Za-z]{1,22}$
      description: |-
        Cloud provider or service credentials for authentication. Used to connect compute environments,
        access storage, and integrate with external services.Identifier of Seqera Platform credentials.
    CredentialsKeysReadModel:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AwsKeysReadModel'
        - $ref: '#/components/schemas/GoogleKeysReadModel'
        - $ref: '#/components/schemas/GithubKeysReadModel'
        - $ref: '#/components/schemas/GithubAppKeysReadModel'
        - $ref: '#/components/schemas/GitlabKeysReadModel'
        - $ref: '#/components/schemas/BitbucketKeysReadModel'
        - $ref: '#/components/schemas/GiteaKeysReadModel'
        - $ref: '#/components/schemas/SshKeysReadModel'
        - $ref: '#/components/schemas/K8sKeysReadModel'
        - $ref: '#/components/schemas/AzureKeysReadModel'
        - $ref: '#/components/schemas/AzureCloudKeysReadModel'
        - $ref: '#/components/schemas/AzureReposKeysReadModel'
        - $ref: '#/components/schemas/AzureEntraKeysReadModel'
        - $ref: '#/components/schemas/ContainerRegistryKeysReadModel'
        - $ref: '#/components/schemas/AgentKeysReadModel'
        - $ref: '#/components/schemas/CodecommitKeysReadModel'
