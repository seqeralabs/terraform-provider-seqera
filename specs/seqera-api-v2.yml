          EKS: '#/components/schemas/EksConfigReadModel'
          GKE: '#/components/schemas/GkeConfigReadModel'
          UGE: '#/components/schemas/UgeConfigReadModel'
          SLURM: '#/components/schemas/SlurmConfigReadModel'
          LSF: '#/components/schemas/LsfConfigReadModel'
          ALTAIR_PBS: '#/components/schemas/AltairPbsConfigReadModel'
          MOAB: '#/components/schemas/MoabConfigReadModel'
          LOCAL: '#/components/schemas/LocalConfigReadModel'
      description: Platform-specific compute environment configuration. The `platform` discriminator selects the configuration variant.
    ComputeEnvConfigReadModelBase:
      type: object
      required:
        - platform
        - environment
      properties:
        platform:
          type: string
          description: |-
            Compute platform provider, which selects the configuration variant. One of `AWS_BATCH`, `AWS_CLOUD`,
            `SEQERA_COMPUTE`, `GOOGLE_BATCH`, `GOOGLE_CLOUD`, `GOOGLE_LIFE_SCIENCES`, `AZURE_BATCH`, `AZURE_CLOUD`, `K8S`,
