      operationId: deleteCredentials
      summary: Delete credentials
      description: |-
        Deletes the credentials.

        Compute environments and data links that authenticate through the credentials are invalidated,
        since they can no longer reach their provider.

        **Required permission:** `credentials:delete`
      parameters:
        - name: workspaceId
          in: path
          required: true
          description: Workspace identifier.
          schema:
            type: string
        - name: credentialsId
          in: path
          required: true
