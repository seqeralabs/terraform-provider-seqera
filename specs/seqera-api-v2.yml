    SchedBackendStrategy:
      type: string
      enum:
        - VM
        - ECS
        - EC2
      description: Backend used by Seqera Scheduler (Intelligent Compute) to run tasks. One of `VM`, `ECS`, or `EC2`.
    SchedConfigReadModel:
      type: object
      required:
        - maxSpotAttempts
        - predictionModel
        - machineTypes
        - maxCpusPerUser
        - fusionSnapshots
        - billingExportTable
        - nvmeEnabled
      properties:
        provisioningModel:
          allOf:
            - $ref: '#/components/schemas/SchedProvisioningModel'
          description: 'Provisioning model of the instances. Accepts `SPOT`, `SPOT_FIRST`, or `ON_DEMAND`. Default: `SPOT_FIRST`.'
        maxSpotAttempts:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 10
          description: |-
            Maximum number of Spot provisioning attempts for a task, including the first attempt, before Spot capacity is
            abandoned. Must be between 1 and 10. `1` means a single attempt with no retry. Applies only when the provisioning
            model is `SPOT` or `SPOT_FIRST`.
        predictionModel:
          type: string
          nullable: true
          description: |-
            Resource prediction model used by Seqera Scheduler to size tasks. Suggested values: `none`, `qr/v1`, `qr/v2`, or
            `qr/v3`. Other values are accepted. Default: `none`.
        machineTypes:
          type: array
          items:
            type: string
          nullable: true
          description: Array of instance types for compute nodes. Leave empty to automatically select the most cost-effective instance types for each task.
        maxCpusPerUser:
          type: integer
          format: int32
          nullable: true
          description: Maximum number of concurrent vCPUs a single user can hold across their runs in this compute environment. If `null`, there is no limit.
        fusionSnapshots:
          type: boolean
          nullable: true
          description: |-
            If `true`, enables Fusion snapshots so that interrupted tasks, such as tasks on reclaimed Spot instances, resume
            from a snapshot instead of restarting from scratch.
        billingExportTable:
          type: string
          nullable: true
          description: |-
            Fully qualified BigQuery table that holds the Cloud Billing export, in `project.dataset.table` format. Enables
            billed-cost retrieval for runs on this compute environment. Google Cloud only. The export is not retroactive, so
            cost is unavailable for runs that predate it. If `null`, cost retrieval is unavailable.
        backendStrategy:
          allOf:
            - $ref: '#/components/schemas/SchedBackendStrategy'
          description: |-
            Backend used to run tasks. Accepts `VM` only when creating a compute environment; `ECS` and `EC2` are deprecated
            and only reported for existing compute environments. Default: `VM`.
        nvmeEnabled:
          type: boolean
          nullable: true
          description: If `true`, uses only instance types with local NVMe SSD storage.
        pool:
          allOf:
            - $ref: '#/components/schemas/SchedPoolReadModel'
          description: Warm-pool configuration. When present and enabled, Seqera Scheduler keeps a pool of idle VMs ready to start incoming tasks with low latency.
      description: Seqera Scheduler (Intelligent Compute) settings for a compute environment.
