        nextflowConfig:
          type: string
          nullable: true
          description: Additional Nextflow configuration to apply. See [Nextflow config file](https://docs.seqera.io/platform-cloud/launch/advanced#nextflow-config-file).
        launchDir:
          type: string
          nullable: true
          description: Launch directory for Nextflow execution, reachable from the head node. If omitted, the work directory is used.
        userName:
          type: string
          nullable: true
          description: Username for SSH authentication to the HPC cluster.
        hostName:
          type: string
          nullable: true
          description: Hostname or IP address of the HPC cluster head node.
        port:
          type: integer
          format: int32
          nullable: true
          description: 'SSH port for connecting to the HPC cluster. Default: `22`.'
        headQueue:
          type: string
          nullable: true
          description: Queue name for submitting the Nextflow head job.
        computeQueue:
          type: string
          nullable: true
          description: Queue name for submitting Nextflow compute jobs.
        maxQueueSize:
          type: integer
          format: int32
          nullable: true
          description: Maximum number of jobs that can be queued at one time.
        headJobOptions:
