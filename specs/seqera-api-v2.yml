    CredentialsKeysWriteModel:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AwsKeysWriteModel'
        - $ref: '#/components/schemas/GoogleKeysWriteModel'
        - $ref: '#/components/schemas/GithubKeysWriteModel'
        - $ref: '#/components/schemas/GithubAppKeysWriteModel'
        - $ref: '#/components/schemas/GitlabKeysWriteModel'
        - $ref: '#/components/schemas/BitbucketKeysWriteModel'
        - $ref: '#/components/schemas/GiteaKeysWriteModel'
        - $ref: '#/components/schemas/SshKeysWriteModel'
        - $ref: '#/components/schemas/K8sKeysWriteModel'
        - $ref: '#/components/schemas/AzureKeysWriteModel'
        - $ref: '#/components/schemas/AzureCloudKeysWriteModel'
        - $ref: '#/components/schemas/AzureReposKeysWriteModel'
        - $ref: '#/components/schemas/AzureEntraKeysWriteModel'
        - $ref: '#/components/schemas/ContainerRegistryKeysWriteModel'
        - $ref: '#/components/schemas/AgentKeysWriteModel'
        - $ref: '#/components/schemas/CodecommitKeysWriteModel'
        - $ref: '#/components/schemas/S3KeysWriteModel'
        - $ref: '#/components/schemas/LocalKeysWriteModel'
      discriminator:
        propertyName: provider
        mapping:
          AWS: '#/components/schemas/AwsKeysWriteModel'
          GOOGLE: '#/components/schemas/GoogleKeysWriteModel'
          GITHUB: '#/components/schemas/GithubKeysWriteModel'
          GITHUB_APP: '#/components/schemas/GithubAppKeysWriteModel'
          GITLAB: '#/components/schemas/GitlabKeysWriteModel'
          BITBUCKET: '#/components/schemas/BitbucketKeysWriteModel'
          GITEA: '#/components/schemas/GiteaKeysWriteModel'
          SSH: '#/components/schemas/SshKeysWriteModel'
          K8S: '#/components/schemas/K8sKeysWriteModel'
          AZURE: '#/components/schemas/AzureKeysWriteModel'
          AZURE_CLOUD: '#/components/schemas/AzureCloudKeysWriteModel'
          AZURE_REPOS: '#/components/schemas/AzureReposKeysWriteModel'
          AZURE_ENTRA: '#/components/schemas/AzureEntraKeysWriteModel'
          CONTAINER_REGISTRY: '#/components/schemas/ContainerRegistryKeysWriteModel'
          TW_AGENT: '#/components/schemas/AgentKeysWriteModel'
          CODECOMMIT: '#/components/schemas/CodecommitKeysWriteModel'
          S3: '#/components/schemas/S3KeysWriteModel'
          LOCAL: '#/components/schemas/LocalKeysWriteModel'
      description: Provider-specific keys, including the secrets. The `provider` discriminator determines the variant of credentials.
    CredentialsKeysWriteModelBase:
      type: object
      required:
        - provider
      properties:
        provider:
          type: string
          description: Provider these credentials authenticate against; selects the keys variant.
      description: Fields shared by every credential-keys variant.
    CredentialsPage:
      type: object
      required:
        - items
        - nextPageToken
        - totalSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialsReadModel'
          description: The items in this page.
        nextPageToken:
          type: string
          nullable: true
          description: |-
            Continuation token to pass as `pageToken` to retrieve the next page. `null` on the last page,
            which is how the end of the collection is signalled.
        totalSize:
          type: integer
          format: int64
          description: Total number of items matching the request, across every page.
      description: One page of credentials.
    CredentialsPatchModel:
      type: object
      properties:
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Optional description of the credentials and their intended use.
        baseUrl:
          type: string
          format: uri
          nullable: true
          description: Base URL for the container registry server. Required for container registry credentials.
        keys:
          $ref: '#/components/schemas/CredentialsKeysWriteModel'
      description: |-
        The subset of a credentials object that can be changed after creation. `name`, `provider` and
        `category` are fixed at creation, so they are absent here. `keys` is replaced as a whole rather
        than merged, and must carry the provider the credentials were created with.
    CredentialsReadModel:
      type: object
      required:
        - id
        - name
        - description
        - baseUrl
        - category
        - status
        - message
        - setupSnippet
        - lastUsedAt
        - lastValidatedAt
        - createdAt
        - updatedAt
        - keys
      properties:
        id:
          type: string
          nullable: true
          description: Credentials string identifier.
        name:
          type: string
          description: |-
            Unique name for the credentials. 2-99 characters starting with an alphanumeric, where every
            dash or underscore is followed by an alphanumeric.
        description:
          type: string
          nullable: true
          description: Optional description of the credentials and their intended use.
        baseUrl:
          type: string
          format: uri
          nullable: true
          description: Base URL for the container registry server. Required for container registry credentials.
        category:
          type: string
          nullable: true
