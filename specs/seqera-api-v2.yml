            If `true`, launches override the Fusion version provided by the Nextflow launcher container. Can be enabled only
            when the compute environment runs Wave and Fusion v2. Can be `null`.
        fusionVersion:
          type: string
          nullable: true
          description: |-
            Fusion version used when `overrideNextflowFusionVersion` is `true`. Must be listed by the system catalog and be
            compatible with the deployed services. Clearing it makes launches use the catalog default. Can be `null`.
        fusionSnapshots:
          type: boolean
          nullable: true
          description: |-
            If `true`, Fusion snapshots are enabled. Can be enabled only when the compute environment runs Wave, Fusion v2,
            and Spot instances. Can be `null`.
      description: |-
        The subset of the configuration of a compute environment that can be changed after creation. It applies whatever
        the platform, so it carries no `platform` discriminator.
    ComputeEnvConfigReadModel:
      type: object
      oneOf:
        - $ref: '#/components/schemas/AwsBatchConfigReadModel'
        - $ref: '#/components/schemas/AwsCloudConfigReadModel'
        - $ref: '#/components/schemas/SeqeraComputeConfigReadModel'
        - $ref: '#/components/schemas/GoogleBatchConfigReadModel'
        - $ref: '#/components/schemas/GoogleCloudConfigReadModel'
        - $ref: '#/components/schemas/GoogleLifeSciencesConfigReadModel'
        - $ref: '#/components/schemas/AzureBatchConfigReadModel'
        - $ref: '#/components/schemas/AzureCloudConfigReadModel'
