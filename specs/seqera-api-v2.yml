    AwsKeysReadModel:
      type: object
      required:
        - accessKey
        - assumeRoleArn
        - externalId
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/AwsCredentialsMode'
          description: |-
            AWS credentials authentication mode: `KEYS` for IAM access key authentication, `ROLE` for IAM
            role authentication, `WORKLOAD_IDENTITY` for OIDC workload identity federation.
        accessKey:
          type: string
          nullable: true
          description: AWS IAM access key ID (keys mode).
        assumeRoleArn:
          type: string
          nullable: true
          description: IAM role ARN to assume when using these credentials (role and workload identity modes).
        externalId:
          type: string
          nullable: true
          description: |-
            Platform-managed External ID used when assuming an IAM role. Present when generated or stored
            for role-based AWS credentials.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysReadModelBase'
      description: |-
        AWS credentials for authenticating with Amazon Web Services. Supports IAM access keys and assume
        role configuration.
      title: 'provider: AWS'
    AwsKeysWriteModel:
      type: object
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/AwsCredentialsMode'
          description: |-
            AWS credentials authentication mode: `KEYS` for IAM access key authentication, `ROLE` for IAM
            role authentication, `WORKLOAD_IDENTITY` for OIDC workload identity federation.
        accessKey:
          type: string
          nullable: true
          maxLength: 128
          description: AWS IAM access key ID (keys mode).
        secretKey:
          type: string
          nullable: true
          description: AWS IAM secret access key (keys mode).
        assumeRoleArn:
          type: string
          nullable: true
          description: IAM role ARN to assume when using these credentials (role and workload identity modes).
        useExternalId:
          type: boolean
          nullable: true
          description: |-
            Generate a Platform-managed External ID for `assumeRoleArn`, to be quoted in the role trust
            policy and returned as `externalId` on read. Only applies in `KEYS` mode; in `ROLE` mode an
            External ID is always generated, and in `WORKLOAD_IDENTITY` mode the flag is rejected, since
            that mode never carries one.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysWriteModelBase'
      description: |-
        AWS credentials for authenticating with Amazon Web Services. Supports IAM access keys and assume
        role configuration.
      title: 'provider: AWS'
    AzureBatchConfigReadModel:
      type: object
      required:
        - region
        - workDir
        - preRunScript
        - postRunScript
        - nextflowConfig
        - waveEnabled
        - fusion2Enabled
        - overrideNextflowFusionVersion
        - fusionVersion
        - headPool
        - workerPool
        - tokenDuration
        - jobMaxWallClockTime
        - deleteJobsOnCompletionEnabled
        - deleteTasksOnCompletion
        - terminateJobsOnCompletion
        - deletePoolsOnCompletion
        - headJobCpus
        - headJobMemoryMb
        - subnetId
        - usePrivateAddress
        - managedIdentityClientId
        - managedIdentityPoolClientId
        - managedIdentityHeadResourceId
        - managedIdentityPoolResourceId
      properties:
        region:
          type: string
          description: Azure region (e.g., `eastus`).
        workDir:
          type: string
          nullable: true
          description: Work directory path for storing intermediate workflow files.
        preRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes in the nf-launch script prior to invoking Nextflow processes. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        postRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes after all Nextflow processes have completed. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        nextflowConfig:
          type: string
          nullable: true
          description: Additional Nextflow configuration to apply. See [Nextflow config file](https://docs.seqera.io/platform-cloud/launch/advanced#nextflow-config-file).
        waveEnabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Wave containers](https://docs.seqera.io/wave). Default: `false`.'
        fusion2Enabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Fusion file system](https://docs.seqera.io/fusion). Requires Wave containers. Default: `false`.'
        overrideNextflowFusionVersion:
          type: boolean
          nullable: true
          description: |-
            If `true`, launches override the Fusion version provided by the Nextflow launcher container. Applies only when
            Wave containers and Fusion file system are enabled.
        fusionVersion:
          type: string
          nullable: true
          description: |-
            Fusion version used when `overrideNextflowFusionVersion` is `true`. Must be listed by the system catalog and be
            compatible with the deployed services. If `null`, the catalog default is used.
        headPool:
          type: string
          nullable: true
          description: Batch pool for the Nextflow head job, without Batch Forge.
        workerPool:
          type: string
          nullable: true
          description: |-
            Azure Batch worker pool name used for task execution when separate head and worker pools are configured, without
            Batch Forge. Must differ from `headPool`.
        tokenDuration:
          type: string
          nullable: true
          description: 'Duration of the SAS token created by Nextflow. Default: `12h`.'
        jobMaxWallClockTime:
          type: string
          nullable: true
          description: |-
            Maximum wall clock time for Azure Batch jobs before automatic termination. Accepts human-readable duration syntax,
            for example `7d` or `1d1h1m`. Maximum is 180 days. Default: `7d`.
        deleteJobsOnCompletionEnabled:
          type: boolean
          nullable: true
          description: 'If `true`, Azure Batch jobs are deleted after successful completion. Default: `false`.'
        deleteTasksOnCompletion:
          type: boolean
          nullable: true
          description: 'If `true`, Azure Batch tasks are deleted after completion. Default: `true`.'
        terminateJobsOnCompletion:
          type: boolean
          nullable: true
          description: 'If `true`, Azure Batch jobs are terminated when the workflow completes. Default: `true`.'
        deletePoolsOnCompletion:
          type: boolean
          nullable: true
          description: 'If `true`, automatically deletes Batch pools after completion. Default: `false`.'
        headJobCpus:
          type: integer
          format: int32
          nullable: true
          description: |-
            CPU slots reserved on the head pool VM for the Nextflow head job. Default: `1`, so several head jobs can share a
            head pool VM.
        headJobMemoryMb:
          type: integer
          format: int32
          nullable: true
          description: Memory reserved for the Nextflow head job container, in MiB. If omitted, derived from the head pool VM size.
        subnetId:
          type: string
          nullable: true
          description: Resource ID of the Azure VNet subnet isolating the pools. Requires Entra credentials.
        usePrivateAddress:
          type: boolean
          nullable: true
          description: |-
            If `true`, the Batch Forge pool nodes have no public IP address. Requires Batch Forge and a `subnetId` with
            outbound connectivity. Default: `true` for Batch Forge compute environments with a subnet.
        managedIdentityClientId:
          type: string
          nullable: true
          description: |-
            The ID of a [managed identity client](https://docs.seqera.io/platform-cloud/compute-envs/azure-batch#managed-identity)
            attached to the Azure Batch pool, used by Nextflow to authenticate to Azure Batch and Storage.
        managedIdentityPoolClientId:
          type: string
          nullable: true
          description: Managed identity client ID used by compute tasks running on Azure Batch pool nodes. Can be `null`.
        managedIdentityHeadResourceId:
          type: string
          nullable: true
          description: |-
            Full Azure resource ID of the user-assigned managed identity attached to the head pool for the Nextflow launcher.
            Required with Batch Forge when `managedIdentityClientId` is set. Can be `null`.
        managedIdentityPoolResourceId:
          type: string
          nullable: true
          description: |-
            Full Azure resource ID of the user-assigned managed identity attached to worker pool nodes. Requires Entra
            credentials for management-plane pool creation. Required with Batch Forge when `managedIdentityPoolClientId` is
            set. Can be `null`.
        forge:
          allOf:
            - $ref: '#/components/schemas/AzureBatchForgeReadModel'
          description: |-
            Batch Forge configuration. Batch Forge automatically creates Azure Batch resources during compute environment
            creation. Unset when the pools are not provisioned by Seqera Platform.
      allOf:
        - $ref: '#/components/schemas/ComputeEnvConfigReadModelBase'
      description: Azure Batch compute environment configuration.
      title: 'platform: AZURE_BATCH'
