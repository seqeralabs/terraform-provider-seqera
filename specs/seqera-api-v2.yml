    AzureBatchForgeReadModel:
      type: object
      required:
        - vmType
        - vmCount
        - autoScale
        - disposeOnDeletion
        - containerRegIds
        - bootDiskSizeGb
      properties:
        vmType:
          type: string
          nullable: true
          description: 'Azure VM type used by the Batch pool. Must be a valid Azure Batch VM type. Default: `Standard_D4s_v3`.'
        vmCount:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          description: |-
            Number of VMs in the Batch pool, at least 1. When autoscaling is enabled, this represents the maximum number of
            VMs to which the pool can grow, and automatically scales to 0 when unused. Required unless both `headPool` and
            `workerPool` are given (dual-pool mode), where each pool carries its own count.
        autoScale:
          type: boolean
          nullable: true
          description: If `true`, enables auto-scaling for the Batch pool.
        disposeOnDeletion:
          type: boolean
          nullable: true
          description: If `true`, deletes the Batch compute pools when the compute environment is deleted.
        containerRegIds:
          type: array
          items:
            $ref: '#/components/schemas/CredentialsIdentifier'
          nullable: true
          maxItems: 1
          description: Array of container registry credentials identifiers, to pull private images. At most one.
        bootDiskSizeGb:
          type: integer
          format: int32
          nullable: true
          minimum: 50
          maximum: 4095
          description: |-
            Boot disk size in GB for all pool nodes. Must be between 50 and 4095. If omitted, Azure uses the default disk size
            of the selected VM image. In dual-pool mode, per-pool values in `headPool` and `workerPool` take precedence.
        headPool:
          allOf:
            - $ref: '#/components/schemas/AzureBatchPoolReadModel'
          description: Head pool settings, in dual-pool mode.
        workerPool:
          allOf:
            - $ref: '#/components/schemas/AzureBatchPoolReadModel'
          description: Worker pool settings, in dual-pool mode.
      description: |-
        Batch Forge configuration for Azure Batch compute environments. Batch Forge automatically creates the Azure Batch
        pools required by the compute environment.
