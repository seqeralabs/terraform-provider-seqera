          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Missing required permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
