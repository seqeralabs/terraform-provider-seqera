            the cloud provider. Populated only when a renderer is available for the credential type;
            otherwise omitted.
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the credentials were last used by Seqera Platform.
        lastValidatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent completed validation probe.
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the credential record was created.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the credential record was last updated.
        keys:
          $ref: '#/components/schemas/CredentialsKeysReadModel'
    CredentialsWriteModel:
      type: object
      required:
        - name
        - keys
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 99
          pattern: ^[a-zA-Z\d](?:[a-zA-Z\d]|[-_](?=[a-zA-Z\d])){1,98}$
          description: |-
            Unique name for the credentials. 2-99 characters starting with an alphanumeric, where every
            dash or underscore is followed by an alphanumeric.
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Optional description of the credentials and their intended use.
        baseUrl:
          type: string
          format: uri
          nullable: true
          description: Base URL for the container registry server. Required for container registry credentials.
        category:
          type: string
          nullable: true
          maxLength: 20
          description: |-
            Credential category used to group providers by purpose, for example `cloud-compute`,
            `scm-host`, or `container-reg`.
        keys:
          $ref: '#/components/schemas/CredentialsKeysWriteModel'
      description: |-
        Cloud provider or service credentials for authentication. Used to connect compute environments,
        access storage, and integrate with external services.
    EksConfigReadModel:
      type: object
      required:
        - workDir
        - preRunScript
        - postRunScript
        - nextflowConfig
        - namespace
        - computeServiceAccount
        - headServiceAccount
        - storageClaimName
        - storageMountPath
        - headPodSpec
        - servicePodSpec
        - headJobCpus
        - headJobMemoryMb
        - region
        - clusterName
        - waveEnabled
        - fusion2Enabled
        - overrideNextflowFusionVersion
        - fusionVersion
        - server
        - sslCert
      properties:
        workDir:
          type: string
          nullable: true
          description: Work directory path for storing intermediate workflow files.
        preRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes in the nf-launch script prior to invoking Nextflow processes. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        postRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes after all Nextflow processes have completed. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        nextflowConfig:
          type: string
          nullable: true
          description: Additional Nextflow configuration to apply. See [Nextflow config file](https://docs.seqera.io/platform-cloud/launch/advanced#nextflow-config-file).
        namespace:
          type: string
          nullable: true
          description: 'Kubernetes namespace for workflow execution. Default: `default`.'
        computeServiceAccount:
          type: string
          nullable: true
          description: 'Kubernetes service account to use for Nextflow-submitted pipeline jobs. Default: `default`.'
        headServiceAccount:
          type: string
          nullable: true
          description: |-
            Kubernetes service account to connect to the cluster and launch workflow executions. See
            [Cluster preparation](https://docs.seqera.io/platform-cloud/compute-envs/k8s#cluster-preparation).
        storageClaimName:
          type: string
          nullable: true
          description: PersistentVolumeClaim name used as scratch storage for workflow execution, e.g., `tower-scratch`. Must allow `ReadWriteMany` access mode.
        storageMountPath:
          type: string
          nullable: true
          description: 'Mount path of the persistent volume claim used as scratch storage. Default: `/scratch`.'
        headPodSpec:
          type: string
          nullable: true
          description: |-
            Custom configuration for the pod running the Nextflow head job, e.g., `nodeSelector` and `affinity` constraints.
            Must be a valid PodSpec YAML structure starting with `spec:`.
        servicePodSpec:
          type: string
          nullable: true
          description: |-
            Custom configuration for the compute environment service pod, e.g., `nodeSelector` and `affinity` constraints.
            Must be a valid PodSpec YAML structure starting with `spec:`.
        headJobCpus:
          type: integer
          format: int32
          nullable: true
          description: Number of CPUs allocated for the Nextflow head job.
        headJobMemoryMb:
          type: integer
          format: int32
          nullable: true
          description: Memory allocation for the Nextflow head job in megabytes.
        region:
          type: string
          nullable: true
          description: Cluster region, or zone for Google GKE.
        clusterName:
          type: string
          nullable: true
          description: Cluster name.
        waveEnabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Wave containers](https://docs.seqera.io/wave). Default: `false`.'
        fusion2Enabled:
          type: boolean
          nullable: true
          description: 'If `true`, enables [Fusion file system](https://docs.seqera.io/fusion). Requires Wave containers. Default: `false`.'
        overrideNextflowFusionVersion:
          type: boolean
          nullable: true
          description: |-
            If `true`, launches override the Fusion version provided by the Nextflow launcher container. Applies only when
            Wave containers and Fusion file system are enabled.
        fusionVersion:
          type: string
          nullable: true
          description: |-
            Fusion version used when `overrideNextflowFusionVersion` is `true`. Must be listed by the system catalog and be
            compatible with the deployed services. If `null`, the catalog default is used.
        server:
