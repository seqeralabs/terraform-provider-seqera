      type: object
      required:
        - connectionId
        - workDir
        - shared
      properties:
        connectionId:
          type: string
          nullable: true
          description: Agent connection ID.
        workDir:
          type: string
          nullable: true
          description: Agent working directory.
        shared:
          type: boolean
          nullable: true
          description: Whether the agent connection is shared across multiple workspaces.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysReadModelBase'
      description: Tower Agent credentials for connecting to HPC compute environments without an SSH client.
      title: 'provider: TW_AGENT'
    AgentKeysWriteModel:
      type: object
      required:
        - connectionId
      properties:
        connectionId:
          type: string
          minLength: 1
          description: Agent connection ID.
        shared:
          type: boolean
          nullable: true
          description: Whether the agent connection is shared across multiple workspaces.
      allOf:
        - $ref: '#/components/schemas/CredentialsKeysWriteModelBase'
      description: Tower Agent credentials for connecting to HPC compute environments without an SSH client.
      title: 'provider: TW_AGENT'
    AltairPbsConfigReadModel:
      type: object
      required:
        - workDir
        - preRunScript
        - postRunScript
        - nextflowConfig
        - launchDir
        - userName
        - hostName
        - port
        - headQueue
        - computeQueue
        - maxQueueSize
        - headJobOptions
        - propagateHeadJobOptions
      properties:
        workDir:
          type: string
          nullable: true
          description: Work directory path for storing intermediate workflow files.
        preRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes in the nf-launch script prior to invoking Nextflow processes. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        postRunScript:
          type: string
          nullable: true
          description: |-
            Script that executes after all Nextflow processes have completed. See
            [Pre and post-run scripts](https://docs.seqera.io/platform-cloud/launch/advanced#pre-and-post-run-scripts).
        nextflowConfig:
          type: string
          nullable: true
          description: Additional Nextflow configuration to apply. See [Nextflow config file](https://docs.seqera.io/platform-cloud/launch/advanced#nextflow-config-file).
        launchDir:
          type: string
          nullable: true
          description: Launch directory for Nextflow execution, reachable from the head node. If omitted, the work directory is used.
        userName:
          type: string
          nullable: true
          description: Username for SSH authentication to the HPC cluster.
        hostName:
          type: string
          nullable: true
          description: Hostname or IP address of the HPC cluster head node.
        port:
          type: integer
          format: int32
          nullable: true
          description: 'SSH port for connecting to the HPC cluster. Default: `22`.'
        headQueue:
          type: string
          nullable: true
          description: Queue name for submitting the Nextflow head job.
        computeQueue:
          type: string
          nullable: true
          description: Queue name for submitting Nextflow compute jobs.
        maxQueueSize:
          type: integer
          format: int32
          nullable: true
          description: Maximum number of jobs that can be queued at one time.
        headJobOptions:
          type: string
          nullable: true
          description: Additional options for the head job submission.
        propagateHeadJobOptions:
          type: boolean
          nullable: true
          description: 'If `true`, head job options are propagated to compute jobs. Default: `false`.'
      allOf:
        - $ref: '#/components/schemas/ComputeEnvConfigReadModelBase'
      description: Altair PBS compute environment configuration.
      title: 'platform: ALTAIR_PBS'
