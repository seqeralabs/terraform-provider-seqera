        - $ref: '#/components/schemas/GoogleCloudConfigWriteModel'
        - $ref: '#/components/schemas/GoogleLifeSciencesConfigWriteModel'
        - $ref: '#/components/schemas/AzureBatchConfigWriteModel'
        - $ref: '#/components/schemas/AzureCloudConfigWriteModel'
