          GITLAB: '#/components/schemas/GitlabKeysReadModel'
          BITBUCKET: '#/components/schemas/BitbucketKeysReadModel'
          GITEA: '#/components/schemas/GiteaKeysReadModel'
          SSH: '#/components/schemas/SshKeysReadModel'
          K8S: '#/components/schemas/K8sKeysReadModel'
          AZURE: '#/components/schemas/AzureKeysReadModel'
          AZURE_CLOUD: '#/components/schemas/AzureCloudKeysReadModel'
          AZURE_REPOS: '#/components/schemas/AzureReposKeysReadModel'
          AZURE_ENTRA: '#/components/schemas/AzureEntraKeysReadModel'
          CONTAINER_REGISTRY: '#/components/schemas/ContainerRegistryKeysReadModel'
          TW_AGENT: '#/components/schemas/AgentKeysReadModel'
          CODECOMMIT: '#/components/schemas/CodecommitKeysReadModel'
          SEQERA_COMPUTE: '#/components/schemas/SeqeraComputeKeysReadModel'
          S3: '#/components/schemas/S3KeysReadModel'
          LOCAL: '#/components/schemas/LocalKeysReadModel'
      description: Provider-specific public key metadata. The `provider` discriminator determines the variant of credentials.
    CredentialsKeysReadModelBase:
      type: object
      required:
