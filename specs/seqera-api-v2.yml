          description: |-
            Explanation of the outcome: the reason a check failed, or the reason a provider could not be reached on a
            transient failure. Can be `null` when the compute environment is `AVAILABLE`.
        transientError:
          type: boolean
          description: |-
            If `true`, a provider could not be reached (timeout, throttling, or 5xx), so the persisted status is left
            unchanged and must not be read as an authoritative rejection. Retry later.
      description: The outcome of re-running the pre-flight checks of a compute environment.
    ValidateCredentialsResponse:
      type: object
      required:
        - status
        - message
        - transientError
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/CredentialStatus'
          description: |-
            Validation health resulting from the probe. AVAILABLE = the probe succeeded; INVALID = the
            provider authoritatively rejected the credentials; on a transient failure this carries the
            unchanged persisted status.
        message:
          type: string
          nullable: true
          description: Provider-supplied error detail. Null when the credentials are valid.
        transientError:
          type: boolean
          description: |-
            True when validation could not reach the provider (network error / 5xx). When true the
            persisted status is left untouched and MUST NOT be interpreted as an authoritative reject.
      description: The outcome of checking a set of credentials against their provider.
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name or path of the field that failed validation.
        message:
          type: string
          description: Human-readable explanation of why the value was rejected.
        rejectedValue:
          type: string
          nullable: true
          description: The submitted value that was rejected.
      description: A single field-level validation failure.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://{host}
    description: Self-hosted
    variables:
      host:
        default: seqera.institution-example.com
  - url: https://api.cloud.seqera.io
    description: Seqera Cloud
    variables: {}
