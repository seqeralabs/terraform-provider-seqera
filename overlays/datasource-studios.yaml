overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Studios List Data Source Overlay
  version: 0.0.1
actions:
  # Pagination is not exposed: the platform returns at most 100 Studios per
  # request. `total_size` is returned so callers can detect truncation and
  # narrow the result with `search`.
  - target: $.paths['/studios'].get.parameters[?(@.name == 'max')]
    remove: true
  - target: $.paths['/studios'].get.parameters[?(@.name == 'offset')]
    remove: true
  - target: $.paths['/studios'].get.parameters[?(@.name == 'attributes')]
    remove: true

  # Studios list data source - modify existing GET /studios endpoint
  - target: $.paths['/studios'].get
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: StudiosList#read
      x-speakeasy-name-override: ListStudiosDataSource
      summary: List Studios
      description: |
        Lists Studios in a workspace. Use `search` to filter by name or tool image.
      tags:
        - studios
      operationId: ListStudiosDataSource
      parameters:
        - name: workspaceId
          in: query
          description: Workspace numeric identifier
          required: true
          x-speakeasy-param-optional: false
          schema:
            type: integer
            format: int64
        - name: search
          in: query
          description: 'Optional search criteria. Free text matches the Studio name and tool image URL. The keywords `userId`, `computeEnvId` and `status` filter on those fields.'
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStudiosDataSourceResponse"
        "400":
          description: Bad request
        "403":
          description: Operation not allowed
        "404":
          description: Workspace not found or Studios not enabled
      security:
        - BearerAuth: []

  - target: $.components.schemas
    update:
      ListStudiosDataSourceResponse:
        type: object
        required:
          - workspaceId
          - studios
        properties:
          workspaceId:
            type: integer
            format: int64
            description: Workspace ID used for filtering
          search:
            type: string
            description: Search criteria used for filtering
          totalSize:
            type: integer
            format: int64
            description: Total number of Studios matching the query. The platform returns at most 100 Studios per request, so if this exceeds the length of `studios`, narrow the query with `search`.
          studios:
            type: array
            description: List of Studios
            items:
              type: object
              properties:
                sessionId:
                  type: string
                  description: Studio session identifier
                name:
                  type: string
                  description: Studio name
                description:
                  type: string
                  nullable: true
                  description: Studio description
                workspaceId:
                  type: integer
                  format: int64
                  description: Workspace the Studio belongs to
                isPrivate:
                  type: boolean
                  description: Whether the Studio is private to its creator
                baseImage:
                  type: string
                  nullable: true
                  description: Base container image the Studio is built from
                customImage:
                  type: boolean
                  description: Whether the Studio runs a custom image built by Wave
        x-speakeasy-entity: StudiosList
        x-speakeasy-entity-description: |
          Data source for listing Studios in a Seqera Platform workspace.

          Returns the Studios in a workspace, optionally filtered with `search`.
          The platform returns at most 100 Studios per request; `total_size` reports
          how many match so truncation can be detected. Use Terraform locals with
          for expressions to look up a Studio by name.
