overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Intelligent Compute Scheduler Config Overlay
  version: 0.0.1

# Customises the shared SchedConfig schema: the `intelligent_compute_config`
# block of `seqera_aws_cloud_ce`, `seqera_azure_cloud_ce`, `seqera_gcp_cloud_ce`
# and the `aws_cloud`, `azure_cloud`, `google_cloud` and `local_platform`
# blocks of `seqera_compute_env`. Every action here applies to all of them, so
# keep descriptions provider-neutral. Renames and validators on
# each platform's own `schedConfig` property stay in that platform's overlay.
actions:
  - target: $.components.schemas.SchedConfig.properties.provisioningModel
    update:
      description: |
        Provisioning strategy for Seqera Intelligent Compute nodes.
        Case-sensitive — must be one of:
        - `spotFirst` (default): try spot instances first, fall back to on-demand if capacity is unavailable. Recommended for cost.
        - `spot`: spot instances only — lower cost, but jobs may be interrupted if capacity is reclaimed.
        - `ondemand`: on-demand instances only — maximum reliability at a higher cost.

        Note: `"onDemand"` / `"on-demand"` are rejected by the API.
      type: string
      enum:
        - spot
        - spotFirst
        - ondemand
      default: spotFirst
      example: "spotFirst"
      x-speakeasy-param-force-new: true

  # The provider drops an empty machineTypes from requests (omitempty) and the
  # API returns an unset list as null. Read null back as [] so a configured
  # `[]` matches the state instead of forcing a replacement on every plan
  # (#321). An omitted attribute is Optional+Computed and takes [] from state.
  - target: $.components.schemas.SchedConfig
    update:
      x-speakeasy-transform-from-api:
        jq: '.machineTypes = (.machineTypes // [])'

  - target: $.components.schemas.SchedConfig.properties.machineTypes
    update:
      description: |
        Instance types eligible for Seqera Intelligent Compute nodes.
        Omit it, or set it to `[]`, to let the scheduler pick the most
        cost-optimal types per task. When populated, the scheduler is
        restricted to this whitelist; types outside the platform's filtered
        catalog for the scheduler are accepted by the API but may produce
        warnings.
      x-speakeasy-param-force-new: true
      x-speakeasy-terraform-custom-type:
        imports:
          - github.com/hashicorp/terraform-plugin-framework/types/basetypes
        schemaType: "basetypes.ListType{ElemType: basetypes.StringType{}}"
        valueType: basetypes.ListValue

  # backendStrategy is hidden: VM (the API default) is the only value the API
  # accepts on create, and the AWS-only ECS and EC2 backends are deprecated and
  # only reported for compute environments created before the deprecation.
  # Exposing a single-valued attribute only invites mistakes, so the provider
  # never sends it and the API applies VM.
  - target: $.components.schemas.SchedConfig.properties.backendStrategy
    remove: true
  - target: $.components.schemas.SchedConfig.properties.maxSpotAttempts
    update:
      description: |
        Maximum number of Spot provisioning attempts for a task, including the
        first one, before giving up on Spot capacity. `1` means a single attempt
        with no retry. Only used when `provisioning_model` is `spot` or
        `spotFirst` (the default).

        Must be a whole number between 1 and 10 (inclusive).
      example: 5
      x-speakeasy-plan-validators: MaxSpotAttemptsValidator
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.properties.predictionModel
    update:
      description: |
        Resource-prediction model used by Intelligent Compute to size tasks.
        Suggested values: `none` (default), `qr/v1`, `qr/v2`, `qr/v3`. Any other
        string is accepted.
      example: "none"
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.properties.fusionSnapshots
    update:
      description: |
        Enable Fusion snapshots so interrupted (e.g. spot-reclaimed) tasks can
        resume from a snapshot instead of restarting from scratch. Not supported
        on Azure compute environments.
      example: false
      x-speakeasy-param-force-new: true
  # diskAllocation is the real persisted field. The backend also exposes
  # nvmeEnabled as a synthetic boolean view over it (getNvmeEnabled() ==
  # diskAllocation == 'nvme'), which carries no independent value — so keep
  # disk_allocation and ignore the nvme_enabled helper below.
  - target: $.components.schemas.SchedConfig.properties.diskAllocation
    update:
      description: |
        Disk-allocation strategy for Intelligent Compute nodes. Set to `nvme` to
        restrict to instance types that provide local SSD (NVMe) storage. Leave
        unset for no local-storage requirement.
      example: "nvme"
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.properties.nvmeEnabled
    update:
      x-speakeasy-param-readonly: true
      x-speakeasy-terraform-ignore: true
  - target: $.components.schemas.SchedConfig.properties.pool
    update:
      description: |
        Warm-pool configuration. When present and enabled, the scheduler keeps a
        pool of idle VMs ready to absorb incoming tasks with sub-5s start latency.
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.Pool.properties.enabled
    update:
      description: |
        Whether the warm pool is active for this compute environment. When
        `false`, the scheduler will not maintain idle VMs.
      example: true
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.Pool.properties.desiredWarm
    update:
      description: |
        Target number of idle VMs to keep warm. Bounds total warm-VM cost across
        all of this compute environment's pool clusters.
      example: 1
      x-speakeasy-param-force-new: true
  - target: $.components.schemas.SchedConfig.Pool.properties.scaleToZeroSecs
    update:
      description: |
        Seconds of inactivity after which the warm pool scales to zero. Set to `0`
        to never scale to zero.
      example: 300
      x-speakeasy-param-force-new: true
