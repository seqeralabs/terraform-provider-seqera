overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Service Accounts Overlay
  version: 0.0.0

# ==============================================================================
# SERVICE ACCOUNTS RESOURCE OVERLAY
# ==============================================================================
#
# Binds /orgs/{orgId}/service-accounts to the seqera_service_account resource.
# A service account is an org-scoped, non-human identity. Add it to a workspace
# with seqera_workspace_participant (member_id) and bind it to an agent with
# seqera_agent (service_account_id).
#
# TERRAFORM EXAMPLES:
# -------------------
# resource "seqera_service_account" "ci" {
#   org_id      = seqera_orgs.main.org_id
#   name        = "ci-agent"
#   description = "Identity for CI-triggered agents"
# }
#
# ==============================================================================

actions:
  # -------------------------------------------------------------------------
  # Operation-level entity bindings
  # -------------------------------------------------------------------------
  - target: $.paths["/orgs/{orgId}/service-accounts"].post
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: ServiceAccount#create

  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].get
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: ServiceAccount#read

  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].patch
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: ServiceAccount#update

  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].delete
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: ServiceAccount#delete

  # -------------------------------------------------------------------------
  # orgId: force-new on every operation (moving orgs means a new account)
  # -------------------------------------------------------------------------
  - target: $.paths["/orgs/{orgId}/service-accounts"].post.parameters[?(@.name=="orgId")]
    update:
      description: Organization numeric identifier
      x-speakeasy-param-force-new: true
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].get.parameters[?(@.name=="orgId")]
    update:
      description: Organization numeric identifier
      x-speakeasy-param-force-new: true
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].patch.parameters[?(@.name=="orgId")]
    update:
      description: Organization numeric identifier
      x-speakeasy-param-force-new: true
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].delete.parameters[?(@.name=="orgId")]
    update:
      description: Organization numeric identifier
      x-speakeasy-param-force-new: true

  # saId in the URL is the `id` returned by create.
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].get.parameters[?(@.name=="saId")]
    update:
      x-speakeasy-match: id
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].patch.parameters[?(@.name=="saId")]
    update:
      x-speakeasy-match: id
  - target: $.paths["/orgs/{orgId}/service-accounts/{saId}"].delete.parameters[?(@.name=="saId")]
    update:
      x-speakeasy-match: id

  # -------------------------------------------------------------------------
  # Entity binding
  # -------------------------------------------------------------------------
  - target: $.components.schemas.ServiceAccountDto
    update:
      x-speakeasy-entity: ServiceAccount
      x-speakeasy-terraform-resource-name: service_account
      x-speakeasy-entity-description: |
        Manage a service account in a Seqera organization. A service account
        is a non-human identity that agents run as.

        To use it, add it to a workspace with `seqera_workspace_participant`
        (`member_id = seqera_service_account.x.member_id`) using a role that
        allows launching agents, then bind it to an agent with
        `seqera_agent.service_account_id = seqera_service_account.x.id`.

        Deleting a service account removes it from every workspace. The
        platform then disables every agent bound to it and pauses every action
        that targets those agents. Terraform does not show these side effects
        in a plan.

        Requires service accounts to be enabled on the Platform instance.

  - target: $.components.schemas.ServiceAccountDto.properties.id
    update:
      description: >-
        Service account numeric identifier (the account's user id). Use it as
        `seqera_agent.service_account_id`.
  - target: $.components.schemas.ServiceAccountDto.properties.memberId
    update:
      description: >-
        Organization membership identifier of the service account. Use it as
        `seqera_workspace_participant.member_id` to add the account to a
        workspace.
  - target: $.components.schemas.ServiceAccountDto.properties.createdAt
    update:
      description: Creation timestamp.

  # Request fields carry the user-facing descriptions and limits.
  - target: $.components.schemas.CreateServiceAccountRequest.properties.name
    update:
      # The Platform validates the name as a user name (SHORT_NAME_REGEX):
      # 2-39 lower-case letters, digits and single dashes, no leading or
      # trailing dash. Expressed without the upstream lookahead, which RE2
      # does not support.
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      minLength: 2
      maxLength: 39
      description: >-
        Service account name: 2 to 39 lower-case letters, digits and single
        dashes, starting and ending with a letter or digit. Names are unique
        across the whole platform, not only the organization; a name already
        in use fails the apply with a conflict.
  - target: $.components.schemas.UpdateServiceAccountRequest.properties.name
    update:
      # The Platform validates the name as a user name (SHORT_NAME_REGEX):
      # 2-39 lower-case letters, digits and single dashes, no leading or
      # trailing dash. Expressed without the upstream lookahead, which RE2
      # does not support.
      pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      minLength: 2
      maxLength: 39
      description: >-
        Service account name: 2 to 39 lower-case letters, digits and single
        dashes, starting and ending with a letter or digit. Names are unique
        across the whole platform, not only the organization; a name already
        in use fails the apply with a conflict.
  - target: $.components.schemas.CreateServiceAccountRequest.properties.description
    update:
      description: Description of the service account, up to 1000 characters.
  - target: $.components.schemas.UpdateServiceAccountRequest.properties.description
    update:
      description: Description of the service account, up to 1000 characters.
