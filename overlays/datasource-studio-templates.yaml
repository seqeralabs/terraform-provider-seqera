overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Studio Templates List Data Source Overlay
  version: 0.0.1
actions:
  # Pagination is not exposed: the platform returns at most 100 templates per
  # request. `total_size` is returned so callers can detect truncation.
  - target: $.paths['/studios/templates'].get.parameters[?(@.name == 'max')]
    remove: true
  - target: $.paths['/studios/templates'].get.parameters[?(@.name == 'offset')]
    remove: true

  # Studio templates data source - modify existing GET /studios/templates endpoint
  - target: $.paths['/studios/templates'].get
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: StudioTemplates#read
      x-speakeasy-name-override: ListStudioTemplatesDataSource
      summary: List available Studio templates
      description: |
        Lists the Studio templates configured on the platform. Each template is a
        tool container image that can be used as a Studio's `data_studio_tool_url`.
      tags:
        - studios
      operationId: ListStudioTemplatesDataSource
      parameters:
        - name: workspaceId
          in: query
          description: Workspace numeric identifier
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListStudioTemplatesDataSourceResponse"
        "400":
          description: Bad request
        "403":
          description: Operation not allowed
        "404":
          description: Studios not enabled
      security:
        - BearerAuth: []

  - target: $.components.schemas
    update:
      ListStudioTemplatesDataSourceResponse:
        type: object
        required:
          - templates
        properties:
          workspaceId:
            type: integer
            format: int64
            description: Workspace ID used for the query
          totalSize:
            type: integer
            format: int64
            description: Total number of templates available. The platform returns at most 100 templates per request.
          templates:
            type: array
            description: List of Studio templates
            items:
              type: object
              properties:
                tool:
                  type: string
                  description: Tool the template provides (for example `jupyter`, `ride`, `vscode` or `xpra`; `custom` when not set)
                repository:
                  type: string
                  description: Container image URL of the template. Use as `data_studio_tool_url` when creating a Studio.
                status:
                  type: string
                  description: Support status of the template. One of `recommended`, `deprecated`, `experimental` or `unsupported`.
                icon:
                  type: string
                  nullable: true
                  description: Icon identifier for the tool
        x-speakeasy-entity: StudioTemplates
        x-speakeasy-entity-description: |
          Data source for listing the Studio templates available on the Seqera Platform.

          Each template is a tool container image that can be used as the
          `data_studio_tool_url` of a `seqera_studios` resource. Use Terraform locals
          with for expressions to select a template by tool and support status.

          The available templates are configured per Platform deployment, so the list
          differs between Seqera Cloud and self-hosted installations.
