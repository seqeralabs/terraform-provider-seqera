overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Agent Actions Overlay
  version: 0.0.0

# ==============================================================================
# AGENT ACTION RESOURCE OVERLAY
# ==============================================================================
#
# Binds synthetic /actions#agent paths to the seqera_agent_action resource: an
# action whose outcome is running a seqera_agent (responseType = "agent")
# instead of launching a pipeline. The generic seqera_action (actions.yaml)
# still covers both outcomes; this resource states the agent-outcome rules in
# its schema:
#   - agent_id is required and there is no launch or pipeline block
#   - source is limited to bucket, cron and pipeline_status
#   - responseType is not an attribute; the create transform always sends
#     "agent"
#
# The trigger schemas defined here (ActionBucketTrigger, ActionCronTrigger,
# ActionPipelineStatusTrigger) are outcome-agnostic and shared with
# seqera_pipeline_action.
#
# The API returns trigger settings under the discriminated `config` object,
# not under the request's `bucket`/`cron`/`pipelineStatus` keys. The
# from-api transform maps them back so out-of-band changes show up as drift.
#
# TERRAFORM EXAMPLES:
# -------------------
#
# resource "seqera_agent_action" "triage_on_failure" {
#   workspace_id    = seqera_workspace.main.id
#   name            = "triage-failed-runs"
#   source          = "pipeline_status"
#   agent_id        = seqera_agent.triage.id
#
#   pipeline_status = {
#     pipeline_id = seqera_pipeline.upstream.pipeline_id
#     run_status  = "FAILED"
#   }
# }
#
# resource "seqera_agent_action" "nightly_report" {
#   workspace_id    = seqera_workspace.main.id
#   name            = "nightly-report"
#   source          = "cron"
#   agent_id        = seqera_agent.reporter.id
#
#   cron = {
#     expression = "0 2 * * *"
#     timezone   = "Europe/Madrid"
#   }
# }
#
# ==============================================================================

actions:
  # ============================================================================
  # SYNTHETIC PATHS
  # ============================================================================
  - target: $.paths
    update:
      /actions#agent:
        post:
          x-speakeasy-entity-operation:
            terraform-datasource: null
            terraform-resource: AgentAction#create
          x-speakeasy-name-override: CreateAgentAction
          operationId: CreateAgentAction
          summary: Create agent action
          description: Creates an action that runs a workspace agent when it triggers.
          tags:
            - actions
          parameters:
            - name: workspaceId
              in: query
              description: Workspace numeric identifier
              required: true
              schema:
                type: integer
                format: int64
              x-speakeasy-param-force-new: true
          requestBody:
            description: Agent action create request
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/CreateAgentActionRequest"
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/CreateAgentActionResponse"
            "400":
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Operation not allowed
          security:
            - BearerAuth: []
      /actions/{actionId}#agent:
        get:
          x-speakeasy-entity-operation:
            terraform-datasource: null
            terraform-resource: AgentAction#read
          x-speakeasy-name-override: DescribeAgentAction
          operationId: DescribeAgentAction
          summary: Describe agent action
          description: Retrieves the agent action identified by the given `actionId`.
          tags:
            - actions
          parameters:
            - name: actionId
              in: path
              description: Action string identifier
              required: true
              schema:
                type: string
              x-speakeasy-match: id
            - name: workspaceId
              in: query
              description: Workspace numeric identifier
              required: true
              schema:
                type: integer
                format: int64
              x-speakeasy-param-force-new: true
          responses:
            "200":
              description: OK
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/DescribeAgentActionResponse"
            "400":
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Operation not allowed
          security:
            - BearerAuth: []
        put:
          x-speakeasy-entity-operation:
            terraform-datasource: null
            terraform-resource: AgentAction#update
          x-speakeasy-name-override: UpdateAgentAction
          operationId: UpdateAgentAction
          summary: Update agent action
          description: >-
            Updates the agent action identified by the given `actionId`. The
            `source` and the agent of an existing action cannot change.
          tags:
            - actions
          parameters:
            - name: actionId
              in: path
              description: Action string identifier
              required: true
              schema:
                type: string
              x-speakeasy-match: id
            - name: workspaceId
              in: query
              description: Workspace numeric identifier
              required: true
              schema:
                type: integer
                format: int64
              x-speakeasy-param-force-new: true
          requestBody:
            description: Agent action update request
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/UpdateAgentActionRequest"
          responses:
            "204":
              description: OK - No content
            "400":
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Operation not allowed
            "409":
              description: Duplicate element, or another write changed the action after this request read it
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
          security:
            - BearerAuth: []
        delete:
          x-speakeasy-entity-operation:
            terraform-datasource: null
            terraform-resource: AgentAction#delete
          x-speakeasy-name-override: DeleteAgentAction
          operationId: DeleteAgentAction
          summary: Delete agent action
          description: Deletes the agent action identified by the given `actionId`.
          tags:
            - actions
          parameters:
            - name: actionId
              in: path
              description: Action string identifier
              required: true
              schema:
                type: string
              x-speakeasy-match: id
            - name: workspaceId
              in: query
              description: Workspace numeric identifier
              required: true
              schema:
                type: integer
                format: int64
              x-speakeasy-param-force-new: true
          responses:
            "204":
              description: OK - No content
            "400":
              description: Bad request
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
            "403":
              description: Operation not allowed
          security:
            - BearerAuth: []

  # ============================================================================
  # SCHEMAS
  # ============================================================================
  - target: $.components.schemas
    update:
      # ------------------------------------------------------------------------
      # Trigger blocks (shared with seqera_pipeline_action)
      # ------------------------------------------------------------------------
      ActionBucketTrigger:
        type: object
        description: >-
          Bucket trigger. Fires when the marker file appears under the data
          link. Required when `source` is `bucket`; must not be set otherwise.
        required:
          - dataLinkId
        properties:
          dataLinkId:
            type: string
            description: ID of the data link (bucket) to watch.
            x-speakeasy-param-force-new: true
          markerFile:
            type: string
            description: Name of the file whose arrival fires the action.
          events:
            type: array
            description: Bucket events that fire the action.
            items:
              type: string
      ActionCronTrigger:
        type: object
        description: >-
          Cron trigger. Fires on a schedule. Required when `source` is
          `cron`; must not be set otherwise. Set either `expression` or
          `preset`.
        properties:
          expression:
            type: string
            description: Cron expression for the schedule, for example `0 2 * * *`.
          preset:
            type: string
            description: Named schedule preset, used instead of `expression`.
          timezone:
            type: string
            description: IANA timezone the schedule runs in, for example `Europe/Madrid`.
      ActionPipelineStatusTrigger:
        type: object
        description: >-
          Pipeline-status trigger. Fires when a run of the watched pipeline
          reaches `run_status`. Required when `source` is `pipeline_status`;
          must not be set otherwise.
        required:
          - pipelineId
          - runStatus
        properties:
          pipelineId:
            type: integer
            format: int64
            description: ID of the Launchpad pipeline to watch.
          runStatus:
            description: Run status that fires the action.
            allOf:
              - $ref: "#/components/schemas/WorkflowStatus"

      # ------------------------------------------------------------------------
      # Entity
      # ------------------------------------------------------------------------
      AgentAction:
        type: object
        x-speakeasy-entity: AgentAction
        x-speakeasy-terraform-resource-name: agent_action
        x-speakeasy-entity-description: |
          Manage an action that runs a Seqera agent when it triggers.

          An agent action watches a bucket, a schedule or the status of a
          pipeline's runs, and runs the `seqera_agent` named by
          `agent_id` each time it fires. The agent must be active.
          To launch a pipeline instead, use `seqera_pipeline_action`.

          Migrating from `seqera_action`: an action created with
          `response_type = "agent"` can be moved here without recreating it,
          using a `moved` block (Terraform 1.8+).
        # The API nests trigger settings under the discriminated `config`
        # object and the agent under `agent`. Hoist them to match the
        # request shape. A pipeline action read through this resource (for
        # example on import) is refused instead of producing a broken state.
        x-speakeasy-transform-from-api:
          jq: >-
            if (.responseType // "agent") != "agent" then
              error("action " + .id + " launches a pipeline; manage it with seqera_pipeline_action")
            else
              . + {
                agentId: .agent.agentConfigId,
                bucket: (if .config.discriminator == "bucket" then .config | {dataLinkId, markerFile, events} else null end),
                cron: (if .config.discriminator == "cron" then .config | {expression, preset, timezone} else null end),
                pipelineStatus: (if .config.discriminator == "pipeline_status" then .config | {pipelineId, runStatus} else null end)
              } | del(.agent, .config)
            end
        properties:
          id:
            type: string
            description: Action identifier.
            x-speakeasy-param-readonly: true
            x-speakeasy-param-suppress-computed-diff: true
          name:
            type: string
            description: Name of the action.
          source:
            type: string
            description: Event source that triggers the action.
            enum:
              - bucket
              - cron
              - pipeline_status
          agentId:
            type: string
            description: ID of the `seqera_agent` to run.
          bucket:
            allOf:
              - $ref: "#/components/schemas/ActionBucketTrigger"
            x-speakeasy-param-computed: false
          cron:
            allOf:
              - $ref: "#/components/schemas/ActionCronTrigger"
            x-speakeasy-param-computed: false
          pipelineStatus:
            allOf:
              - $ref: "#/components/schemas/ActionPipelineStatusTrigger"
            x-speakeasy-param-computed: false
          status:
            description: Current status of the action.
            allOf:
              - $ref: "#/components/schemas/Action.Status"
            x-speakeasy-param-readonly: true
          error:
            type: string
            description: Error reported by the Platform for the action, if any.
            x-speakeasy-param-readonly: true
          nextExecution:
            type: string
            format: date-time
            description: Next scheduled run of a `cron` action.
            x-speakeasy-param-readonly: true

      CreateAgentActionRequest:
        type: object
        required:
          - name
          - source
          - agentId
        x-speakeasy-transform-to-api:
          jq: '. + { responseType: "agent", agent: { agentConfigId: .agentId } } | del(.agentId)'
        properties:
          name:
            type: string
          source:
            type: string
            enum:
              - bucket
              - cron
              - pipeline_status
            x-speakeasy-param-force-new: true
            x-speakeasy-plan-validators: ActionTriggerSourceValidator
          agentId:
            type: string
            x-speakeasy-param-force-new: true
          bucket:
            allOf:
              - $ref: "#/components/schemas/ActionBucketTrigger"
            x-speakeasy-param-computed: false
          cron:
            allOf:
              - $ref: "#/components/schemas/ActionCronTrigger"
            x-speakeasy-param-computed: false
          pipelineStatus:
            allOf:
              - $ref: "#/components/schemas/ActionPipelineStatusTrigger"
            x-speakeasy-param-computed: false
          labelIds:
            type: array
            description: >-
              IDs of the labels to attach to the action. Removing this
              attribute leaves the current labels in place.
            items:
              type: integer
              format: int64

      UpdateAgentActionRequest:
        type: object
        properties:
          name:
            type: string
          bucket:
            allOf:
              - $ref: "#/components/schemas/ActionBucketTrigger"
            x-speakeasy-param-computed: false
          cron:
            allOf:
              - $ref: "#/components/schemas/ActionCronTrigger"
            x-speakeasy-param-computed: false
          pipelineStatus:
            allOf:
              - $ref: "#/components/schemas/ActionPipelineStatusTrigger"
            x-speakeasy-param-computed: false
          labelIds:
            type: array
            items:
              type: integer
              format: int64

      CreateAgentActionResponse:
        type: object
        x-speakeasy-transform-from-api:
          jq: ". + { id: .actionId }"
        properties:
          id:
            type: string
            x-speakeasy-param-readonly: true
            x-speakeasy-param-suppress-computed-diff: true

      DescribeAgentActionResponse:
        type: object
        properties:
          action:
            $ref: "#/components/schemas/AgentAction"
